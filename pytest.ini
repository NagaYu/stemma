[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers: a typo'd marker is an error, not a silently-skipped test.
# -ra: show the reason for every skip/xfail, so "the network test was skipped"
#      is visible in CI output rather than hidden behind a dot.
addopts = -ra --strict-markers --durations=10

markers =
    network: hits the real Hugging Face CDN; skipped unless STEMMA_NETWORK_TESTS=1
    slow: takes more than a couple of seconds

filterwarnings =
    default
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning
